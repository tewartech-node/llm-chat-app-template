<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warnetwork LLM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0b0d10;color:#e6e6e6;display:flex;flex-direction:column;height:100vh;}
  #topbar{padding:.6rem 1rem;font-size:.8rem;color:#9aa0a6;border-bottom:1px solid #22262b;display:flex;justify-content:space-between;align-items:center;}
  #who{color:#8ac1ff;}
  #signOut{background:none;border:none;color:#9aa0a6;text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0;margin-left:.75rem;}
  #log{flex:1;overflow-y:auto;padding:1rem;}
  .msg{margin-bottom:.75rem;line-height:1.4;white-space:pre-wrap;}
  .user{color:#8ac1ff;}
  .bot{color:#e6e6e6;}
  #inputRow{display:flex;padding:.75rem;border-top:1px solid #22262b;gap:.5rem;}
  #inputRow input{flex:1;padding:.6rem;border-radius:.4rem;border:1px solid #333;background:#15181c;color:#fff;}
  #inputRow button{padding:.6rem 1rem;border-radius:.4rem;border:none;background:#2563eb;color:#fff;}
  #inputRow button:disabled{background:#444;}
  #gate{position:fixed;inset:0;background:#0b0d10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.75rem;padding:1.5rem;text-align:center;}
  #gateErr{color:#ff6b6b;font-size:.85rem;min-height:1.2em;}
</style>
</head>
<body>

<div id="gate">
  <h2 style="margin:0;">Sign in to chat</h2>
  <p style="color:#9aa0a6;max-width:320px;margin:0;">We use your Google account to keep your conversations and memories private to you.</p>
  <div id="g_id_signin"></div>
  <div id="gateErr"></div>
</div>

<div id="topbar" style="display:none;">
  <span>Warnetwork LLM</span>
  <span><span id="who"></span><button id="signOut">Sign out</button></span>
</div>
<div id="log" style="display:none;"></div>
<div id="inputRow" style="display:none;">
  <input id="input" placeholder="Type a message…">
  <button id="send">Send</button>
</div>

<script>
const logEl = document.getElementById("log");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const topbar = document.getElementById("topbar");
const whoEl = document.getElementById("who");
const signOutBtn = document.getElementById("signOut");
const gate = document.getElementById("gate");
const gateErr = document.getElementById("gateErr");

// Public OAuth Web Client ID from Google Cloud Console (not a secret).
// Must match the GOOGLE_CLIENT_ID var in wrangler.jsonc.
const GOOGLE_CLIENT_ID = "1034434258543-1ae27iai1tuco327ig8m1v7h8vqurvcu.apps.googleusercontent.com";

const history = [];

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  div.textContent = (role === "user" ? "You: " : "AI: ") + text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

async function handleCredentialResponse(response) {
  gateErr.textContent = "";
  try {
    const res = await fetch("/api/auth/google", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ credential: response.credential }),
    });
    const data = await res.json();
    if (!res.ok) {
      gateErr.textContent = data.error || "Sign-in failed.";
      return;
    }
    startChat(data.username);
  } catch (e) {
    gateErr.textContent = "Sign-in failed.";
  }
}

async function signOut() {
  await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
  location.reload();
}

async function startChat(username) {
  gate.style.display = "none";
  topbar.style.display = "flex";
  logEl.style.display = "block";
  document.getElementById("inputRow").style.display = "flex";
  whoEl.textContent = username;

  // Load this user's private history (identity comes from the session cookie)
  const res = await fetch("/api/history", { credentials: "same-origin" });
  if (res.ok) {
    const data = await res.json();
    for (const m of data.messages) {
      history.push({ role: m.role, content: m.content });
      addMsg(m.role, m.content);
    }
    if (data.messages.length) {
      addMsg("bot", `— welcome back, ${username} —`);
    }
  }

  inputEl.focus();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });

  const botDiv = addMsg("bot", "");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (res.status === 401) {
      botDiv.textContent = "AI: (session expired — please sign in again)";
      sendBtn.disabled = false;
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop() ?? "";
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.response) {
            full += parsed.response;
            botDiv.textContent = "AI: " + full;
            logEl.scrollTop = logEl.scrollHeight;
          }
        } catch {}
      }
    }
    history.push({ role: "assistant", content: full });
  } catch (e) {
    botDiv.textContent = "AI: (error getting a response)";
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
signOutBtn.addEventListener("click", signOut);

(async function init() {
  const res = await fetch("/api/me", { credentials: "same-origin" });
  if (res.ok) {
    const data = await res.json();
    startChat(data.username);
    return;
  }
  window.onload = () => {
    if (!window.google) return;
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
    });
    google.accounts.id.renderButton(document.getElementById("g_id_signin"), {
      theme: "outline",
      size: "large",
    });
  };
})();
</script>
</body>
</html>
